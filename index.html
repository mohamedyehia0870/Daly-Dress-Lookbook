<style>
:root{--bg:#f3f4f5;--ink:#3a3a3a;--frame:#e0b783;--chip:#e9eaec;--icon:#4a4a4a;--muted:#9a9a9a;--pop:#fff;--e1:#cd9f63;--e2:#e4b882;--eo:#b78747;--ei:#c3935a;--logo:#10294a;--ln:1px;--gp:.5px}
@media (prefers-color-scheme:dark){:root{--bg:#1d1e20;--ink:#e6e6e6;--chip:#2c2d30;--icon:#d8d8d8;--muted:#777;--pop:#2c2d30;--e1:#a97a43;--e2:#c99c63;--eo:#8a6234;--ei:#9a6e3b;--logo:#e6e6e6}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;flex-direction:column;overflow:hidden;user-select:none}
header{display:flex;align-items:center;gap:12px;padding:8px 24px;flex:none}
#hLogo{height:30px;width:auto;display:block;flex:none;margin-right:4px;pointer-events:none}
header h1{font-size:17px;font-weight:600;margin:0;letter-spacing:.01em}
#counter{background:var(--chip);border-radius:6px;padding:6px 12px;font-size:15px}
main{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center}
#stage{transform-origin:center;transition:transform .25s ease}
#stage.drag{transition:none}
#shift{position:relative;will-change:transform}
.stf__item,.stf__block{will-change:transform}
#book{box-shadow:none;touch-action:none}
/* page-thickness edges */
.edge{position:absolute;top:2px;bottom:2px;width:0;pointer-events:none;
  background:repeating-linear-gradient(90deg,var(--e1) 0 var(--ln),var(--e2) var(--ln) calc(var(--ln) + var(--gp)))}
/* soft shadow along the spine, between the two pages */
#gutter{display:none;position:absolute;pointer-events:none;z-index:6;opacity:0;transition:opacity .25s;transform:translateX(-50%);
  background:linear-gradient(90deg,rgba(0,0,0,0) 0%,rgba(0,0,0,.1) 30%,rgba(0,0,0,.27) 50%,rgba(0,0,0,.1) 70%,rgba(0,0,0,0) 100%)}
#edgeL{right:100%;border-radius:2px 0 0 2px;box-shadow:inset 1px 0 0 var(--eo),inset -1px 0 0 var(--ei)}
#edgeR{left:100%;border-radius:0 2px 2px 0;box-shadow:inset -1px 0 0 var(--eo),inset 1px 0 0 var(--ei)}
.page{background:#fff;overflow:hidden}
.page.blank{background:var(--bg)} /* invisible end pages: they keep the library from showing the leaf's own page behind it */
.page .paper{width:100%;height:100%;position:relative}
/* Transparent PDF annotation links sit above the rendered page artwork. */
.pdf-link{position:absolute;display:block;z-index:4;background:transparent;cursor:pointer;text-decoration:none;pointer-events:auto;-webkit-tap-highlight-color:transparent}
.pdf-link:focus-visible{outline:2px solid #2878d0;outline-offset:1px}
.pdf-link{border-radius:50%;transition:transform .25s ease,box-shadow .25s ease,background .25s ease}
.pdf-link[href^="http"]{animation:linkPulse 2s ease-out infinite}
.pdf-link:hover{background:rgba(224,185,131,.25);transform:scale(1.15);animation:none;box-shadow:0 0 0 3px #e0b983,0 0 18px 6px rgba(224,185,131,.75)}
@keyframes linkPulse{0%{box-shadow:0 0 0 0 rgba(224,185,131,.8)}70%{box-shadow:0 0 0 12px rgba(224,185,131,0)}100%{box-shadow:0 0 0 0 rgba(224,185,131,0)}}
.page img{width:100%;height:100%;display:block;object-fit:fill;pointer-events:none;-webkit-user-drag:none;user-select:none;-webkit-touch-callout:none}
.nav{position:absolute;top:50%;transform:translateY(-50%);background:none;border:0;cursor:pointer;color:var(--icon);padding:12px;opacity:.75;z-index:5;transition:opacity .2s}
.nav:hover{opacity:1}.nav svg{width:34px;height:34px;display:block}
#prev{left:14px}#next{right:14px}
#first,#last{position:absolute;bottom:12px;background:none;border:0;cursor:pointer;color:var(--muted);padding:8px;z-index:5;transition:bottom .25s}
#first{left:14px}#last{right:14px}
#pan{position:absolute;inset:0;z-index:4;display:none;cursor:grab}
#pan.on{display:block}
/* zoom bar */
#zoomBar{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:none;align-items:center;gap:14px;background:var(--pop);padding:10px 18px;border-radius:8px;box-shadow:0 2px 12px rgba(0,0,0,.2);z-index:8}
#zoomBar.on{display:flex}
#zoomBar button{background:none;border:0;cursor:pointer;color:var(--icon);font-size:24px;line-height:1;width:28px;height:28px;padding:0;border-radius:4px}
#zoomBar button:hover{background:var(--chip)}
#zRange{width:150px;accent-color:#4a4a4a;cursor:pointer;margin:0}
footer button.on{background:var(--e1)}
#logo{position:absolute;right:24px;bottom:70px;width:130px;z-index:3;color:var(--logo);display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none}
#logo img{width:100%;display:block}
@media (prefers-color-scheme:dark){#logo img,#hLogo{filter:brightness(0) invert(1)}}
#logo .wm{font-size:13px;font-weight:600;letter-spacing:.16em}
footer{flex:none;display:flex;justify-content:center;align-items:center;gap:6px;padding:2px 0 8px;position:relative;z-index:30;background:var(--bg)}
footer button{background:none;border:0;cursor:pointer;color:var(--icon);padding:8px 10px;border-radius:6px}
footer button:hover,.nav:focus-visible,footer button:focus-visible{background:var(--chip);outline:none}
footer button.off{opacity:.45}
footer svg,#first svg,#last svg{width:24px;height:24px;display:block}
.sep{width:1px;height:24px;background:var(--muted);opacity:.5;margin:0 6px}
/* volume popup */
#soundWrap{position:relative;display:inline-flex}
#volPop{display:none;position:absolute;bottom:100%;left:50%;transform:translateX(-50%);width:44px;padding:8px 0 10px;background:var(--pop);border-radius:6px 6px 0 0;box-shadow:0 -2px 10px rgba(0,0,0,.18);flex-direction:column;align-items:center;gap:6px;z-index:10}
#soundWrap:hover #volPop,#soundWrap:focus-within #volPop{display:flex}
#volVal{font-size:14px;line-height:1;min-width:2ch;text-align:center}
#volTrack{position:relative;width:24px;height:96px}
#vol{position:absolute;left:50%;top:50%;width:96px;height:24px;margin:0;transform:translate(-50%,-50%) rotate(-90deg);accent-color:#4a4a4a;cursor:pointer}
/* download modal */
#dlModal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:50}
#dlModal.on{display:flex}
#dlModal .card{background:var(--pop);color:var(--ink);border-radius:10px;width:min(540px,92vw);padding:14px 16px 18px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
#dlModal .hd{display:flex;align-items:center;gap:10px;font-size:17px;margin-bottom:12px}
#dlModal .hd svg{width:24px;height:24px}
#dlModal .hd b{font-weight:500;flex:1}
#dlModal .x{background:none;border:0;cursor:pointer;color:var(--icon);font-size:26px;line-height:1;padding:0 6px}
#dlFull{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--chip);border:1px solid var(--muted);border-radius:6px;padding:12px;cursor:pointer;color:var(--ink);font:inherit}
#dlFull .pdf{flex:none;width:40px;height:48px;border:2px solid var(--icon);border-radius:4px;position:relative}
#dlFull .pdf i{position:absolute;left:-8px;top:18px;background:#d93025;color:#fff;font:700 10px/1 sans-serif;font-style:normal;padding:3px 4px;border-radius:2px}
#dlFull b{display:block;font-weight:500;font-size:17px;margin-bottom:6px}
#dlFull span{font-size:16px}
.lnk{display:flex;align-items:center;gap:12px;background:none;border:0;color:var(--ink);font:inherit;font-size:17px;text-decoration:underline;cursor:pointer;padding:12px 4px 0}
.lnk svg{width:24px;height:24px;flex:none}
.lnk[hidden]{display:none}
#loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:var(--bg);z-index:20;font-size:15px}
#bar{width:220px;height:4px;background:var(--chip);border-radius:2px;overflow:hidden}
#bar i{display:block;height:100%;width:0;background:var(--frame);transition:width .2s}
#prog{position:fixed;top:0;left:0;right:0;height:2px;z-index:70;pointer-events:none;transition:opacity .4s}
#prog i{display:block;height:100%;width:0;background:var(--frame);transition:width .2s}
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:8px 14px;border-radius:6px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:60}
#toast.on{opacity:1}
@media (max-width:700px){#hLogo{height:24px}header{padding:10px 14px}.nav{display:none}#first,#last{display:none}}
@media (prefers-reduced-motion:reduce){#stage,.nav{transition:none}}
</style>

      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M11 3h2v9l3-3 1.4 1.4L12 16l-5.4-5.6L8 9l3 3zM4 18h16v3H4z"/></svg>
      <b>Download</b>
      <button class="x" id="dlClose" aria-label="Close">&times;</button>
    </div>
    <button id="dlFull">
      <span class="pdf"><i>.PDF</i></span>
      <div><b id="dlFullTitle">AW27 DALYDRESS LOOKBOOK</b><span>Download the AW27 DALYDRESS LOOKBOOK as a PDF file.</span></div>
    </button>
    <button class="lnk" id="dlRight"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 3h8l4 4v14H6z"/></svg><span id="dlRightT">Current Right Page</span></button>
    <button class="lnk" id="dlLeft"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M18 3h-8L6 7v14h12z"/></svg><span id="dlLeftT">Current Left Page</span></button>
  </div>
</div>
<div id="toast"></div>
<div id="prog"><i></i></div>

<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
<script>
/* ---------- SETTINGS: edit these ---------- */
/* PDF_URL is set at the top of the page (in <head>) so the download can start immediately. */
const LOGO_URL = "logo.png";       // your DalyDress logo, placed next to index.html
const TITLE = "AW27 DALYDRESS LOOKBOOK";       // shown top-left
const PAGES_DIR = "pages/";            // folder made by make_pages.py, placed next to index.html
const MAX_HI_KEPT = 4;                 // how many sharp (zoom) pages may stay in memory at once
const AUTOPLAY_MS = 3000;          // ms between pages in auto-play
const MAX_EDGE = 26;               // max thickness (px) of the page-stack edges (more px = more lines)
const EDGE_LINE_PX = 1.5;          // thickness of each darker page line in the edges
const EDGE_GAP_PX = 1.5;           // thickness of the lighter band between the lines
const ZOOM_DEFAULT = 2, ZOOM_MAX = 4, ZOOM_STEP = 0.25;   // zoom button / zoom bar
/* ------------------------------------------ */

const $ = id => document.getElementById(id);
document.title = TITLE; $("title").textContent = TITLE;
let ptrDown=false;
addEventListener("pointerdown",()=>{ptrDown=true;},true);
["pointerup","pointercancel","blur"].forEach(n=>addEventListener(n,()=>{ptrDown=false;},true));
let flip, total = 0, N = 0, M = 0, /* N = total rounded up to even; M = N + 2 invisible end pages */ soundOn = true, vol = 0.7, zoom = 0, timer = null;
document.documentElement.style.setProperty("--ln",EDGE_LINE_PX+"px");
document.documentElement.style.setProperty("--gp",EDGE_GAP_PX+"px");

/* Logo (falls back to a text mark if logo.png is missing) */
$("logoImg").onerror = () => {
  $("logo").innerHTML = '<svg viewBox="0 0 44 44" width="44" height="44" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6v32M12 6h9a16 16 0 0 1 0 32h-9"/></svg><span class="wm">DALYDRESS</span>';
};
$("logoImg").src = LOGO_URL;

/* Page-turn sound (flip.mp3 next to index.html) */
const SOUND_FILES = ["flip.mp3","flip2.mp3","flip3.mp3","flip4.mp3"];
let sounds = [];
function initSounds(){
  if(sounds.length) return;
  sounds = SOUND_FILES.map(f=>{const a=new Audio();a.preload="auto";a.src=f;a.volume=vol;return a;});
}
/* loaded after the pages finish, or on the first click/key, whichever comes first */
addEventListener("pointerdown",initSounds,{once:true,capture:true});
addEventListener("keydown",initSounds,{once:true,capture:true});
let lastSnd = -1;
function swish(){
  if(!soundOn || vol === 0) return;
  initSounds();
  let i; do{ i = Math.floor(Math.random()*sounds.length); }while(sounds.length>1 && i===lastSnd);
  lastSnd = i;
  try{ sounds[i].currentTime = 0; const p=sounds[i].play(); if(p&&p.catch) p.catch(()=>{}); }catch(e){}
}

function toast(t){const e=$("toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),1800);}

/* RTL book. Library position q:  0 = invisible page, 1..N = reading pages N..1 (cover = q N), M-1 = invisible page.
   Spreads are (0,1) (2,3) ... (N,N+1): the cover (q=N) sits on the LEFT half with an invisible page on its right. */
const pageAt = q => { if(q<1||q>N) return null; const p=N+1-q; return p>total?null:p; };
const pdfIdx = q => { const p=pageAt(q); return p===null?undefined:p-1; };
const isPortrait = () => flip.getOrientation()==="portrait";
function updateCounter(){
  if(!flip) return;
  const i = flip.getCurrentPageIndex();
  const a = pageAt(i);
  let s;
  if(isPortrait()) s = `Page ${a||(i<1?total:1)} of ${total}`;
  else { const b = pageAt(i+1); s = (a&&b) ? `Pages ${a}–${b} of ${total}` : `Page ${a||b} of ${total}`; }
  $("counter").textContent = s;
}

function layout(){
  const m=$("main"), aspect=layout.aspect||0.7;
  const h = m.clientHeight-4, w = m.clientWidth-(innerWidth>700?200:20);
  /* The library goes single-page only when its block is narrower than 2*minWidth (400px).
     Use exactly that rule here so the book box and the library never disagree. */
  const bhL = Math.min(h, (w/2)/aspect), bwL = bhL*aspect*2;
  const portrait = bwL < 400;
  const bh = portrait ? Math.min(h, w/aspect) : bhL;
  const bw = bh*aspect*(portrait?1:2);
  $("book").style.width = bw+"px"; $("book").style.height = bh+"px";
  layout.bw = bw;
  const fits = m.clientWidth/2 + bw/2 + MAX_EDGE + 66 <= m.clientWidth - 24 - 130;
  $("logo").style.display = (fits && innerWidth>700) ? "flex" : "none";
  return {pw:Math.round(bh*aspect), ph:Math.round(bh)};
}

function targetSpread(dir){
  const i = flip.getCurrentPageIndex();
  if(isPortrait()) return Math.max(1,Math.min(N,i+dir));
  const t = i + 2*dir;
  return (t<0||t>M-2) ? i : t;
}

/* ---- Book shift, driven by JS so it runs on the SAME clock as the page turn ----
   Everything that moves when the cover / back page turns (book shift, page-stack edges,
   arrows, jump buttons) is one set of numbers that we tween frame by frame. */
const FLIP_MS = 700;    /* keep equal to flippingTime in the PageFlip settings */
const linear = t => t;
const easeIO = t => t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const KEYS = ["sx","L","R","pl","nr","fl","lr"];
let cur = null, anim = null;
const mix = (a,b,e) => { const o={}; KEYS.forEach(k=>o[k]=a[k]+(b[k]-a[k])*e); return o; };

function viewVals(idx){
  const portrait = isPortrait(), bw = layout.bw||0;
  const ends = !portrait && (idx===0 || idx===M-2);
  const p = Math.min(1,Math.max(0,idx/(M-2)));
  const L = ends ? 0 : MAX_EDGE*p, R = ends ? 0 : MAX_EDGE*(1-p);
  let sx = 0;
  if(!portrait){ if(idx===0) sx = -bw/4; else if(idx===M-2) sx = bw/4; }
  const mw = $("main").clientWidth;
  const hv = (!portrait && (idx===0||idx===M-2)) ? bw/4 : bw/2;
  const base = mw/2 - hv - 62, fb = mw/2 - hv - 42;
  return {sx, L, R, pl:base-L, nr:base-R, fl:fb-L, lr:fb-R};
}
function applyVals(v){
  cur = v;
  $("shift").style.transform = `translateX(${v.sx}px)`;
  $("edgeL").style.width = v.L+"px"; $("edgeR").style.width = v.R+"px";
  $("prev").style.left  = Math.max(0,v.pl)+"px";
  $("next").style.right = Math.max(0,v.nr)+"px";
  $("first").style.left = Math.max(0,v.fl)+"px";
  $("last").style.right = Math.max(0,v.lr)+"px";
}
/* page-stack edges follow the library's real book rectangle, so they always match the pages */
function syncGeometry(){
  const portrait = isPortrait();
  try{
    const r = flip.getBoundsRect(), pw2 = r.pageWidth*(portrait?1:2);
    const eL=$("edgeL"), eR=$("edgeR");
    eL.style.top = eR.style.top = (r.top+2)+"px";
    eL.style.height = eR.style.height = Math.max(0,r.height-4)+"px";
    eL.style.bottom = eR.style.bottom = "auto";
    eL.style.left = "auto"; eL.style.right = ($("book").offsetWidth - r.left)+"px";
    eR.style.left = (r.left + pw2)+"px";
  }catch(e){}
  try{
    const r=flip.getBoundsRect(), gt=$("gutter");
    gt.style.left=(r.left+r.pageWidth)+"px"; gt.style.top=r.top+"px"; gt.style.height=r.height+"px";
    gt.style.width=Math.max(14,Math.round(r.pageWidth*.1))+"px";
  }catch(e){}
  const gap = (m_h() - $("book").offsetHeight)/2;
  $("first").style.bottom = $("last").style.bottom = Math.max(0, gap - 2) + "px";
}
let viewIdx = -1;
function updateGutter(){
  const gt=$("gutter"); if(!gt||!flip) return;
  const two = !isPortrait() && viewIdx>0 && viewIdx<M-2;
  const st = flip.getState ? flip.getState() : "read";
  gt.style.opacity = (two && st==="read" && !anim) ? 1 : 0;
}
function tweenTo(target, ms, ease, idx){
  if(anim) cancelAnimationFrame(anim.raf);
  if(reduceMotion || !cur){ anim=null; applyVals(target); return; }
  ms = Math.max(ms, 60);
  const from = {...cur}, t0 = performance.now(), a = {idx, raf:0};
  anim = a;
  const step = now => {
    const k = Math.min(1,(now-t0)/ms);
    applyVals(mix(from,target,ease(k)));
    if(k<1) a.raf = requestAnimationFrame(step); else if(anim===a){ anim=null; updateGutter(); }
  };
  a.raf = requestAnimationFrame(step);
}
/* ms = 0 -> apply immediately.  ms > 0 -> animate over ms.  force -> restart even if already heading there. */
function setView(idx, ms=0, ease=linear, force=false){
  if(!flip) return;
  syncGeometry();
  viewIdx = idx; updateGutter();
  if(anim && !force && ms===0 && anim.idx===idx) return;   /* already animating there: let it finish */
  const target = viewVals(idx);
  if(!ms){ if(anim){cancelAnimationFrame(anim.raf);anim=null;} applyVals(target); updateGutter(); return; }
  tweenTo(target, ms, ease, idx);
}

function m_h(){ return $("main").clientHeight; }

let pendingDir = 0;
function go(dir){
  if(!flip) return;
  const st = flip.getState && flip.getState();
  if(st && st!=="read"){ pendingDir = dir; return; }   /* a turn is running: remember ONE click and play it right after, so input is never ignored */
  const t = targetSpread(dir);
  if(t!==flip.getCurrentPageIndex()) setView(t, FLIP_MS, linear, true);   /* shift starts together with the turn */
  if(!(window.turnAt && window.turnAt(dir,null))) window.libTurn(dir);   /* arrows / keys: lift the page from the middle of its edge */
}

async function main(){
  const man = await (await fetch(PAGES_DIR+"manifest.json")).json();
  window.PDF_BYTES = man.pdfBytes || 0;
  total = man.total;
  layout.aspect = man.aspect;
  const pad = man.pad || 3, num = n => String(n).padStart(pad,"0");
  const BASE = n => PAGES_DIR+num(n)+".webp", HI = n => PAGES_DIR+num(n)+"-hi.webp";
  const {pw,ph} = layout();

  /* Clickable links copied out of the PDF (positions are fractions of the page). */
  function gotoPage(p){
    if(!flip || p<1 || p>total) return;
    let q = N+1-p; if(!isPortrait()) q &= ~1;
    if(q===flip.getCurrentPageIndex()) return;
    flip.turnToPage(q); updateCounter(); setView(q,900,easeIO,true);
  }
  function addLinks(n,paper){
    for(const L of (man.pages[n-1].links||[])){
      const a=document.createElement("a"); a.className="pdf-link";
      a.style.left=(L.r[0]*100)+"%"; a.style.top=(L.r[1]*100)+"%";
      a.style.width=(L.r[2]*100)+"%"; a.style.height=(L.r[3]*100)+"%";
      if(L.url){ a.href=L.url; a.target="_blank"; a.rel="noopener noreferrer"; a.title=L.url; a.setAttribute("aria-label","Open link"); }
      else{ a.href="#page="+L.page; a.title="Go to page "+L.page; a.setAttribute("aria-label","Go to page "+L.page);
            a.addEventListener("click",e=>{ e.preventDefault(); gotoPage(L.page); }); }
      paper.appendChild(a);
    }
  }

  N = total + (total%2); M = N + 2;
  const book = $("book"), imgs = {};
  for(let q=0;q<M;q++){
    const pg=document.createElement("div"), n=pageAt(q);
    pg.className = "page" + ((q===0||q===M-1) ? " blank" : "");
    pg.dataset.density="soft";
    pg.innerHTML = n ? '<div class="paper"><img alt="Page '+n+'"></div>' : '<div class="paper"></div>';
    book.appendChild(pg); if(n){ imgs[n]=pg.querySelector("img"); addLinks(n,pg.querySelector(".paper")); }
  }
  flip = new St.PageFlip(book,{width:pw,height:ph,size:"stretch",minWidth:200,maxWidth:2400,minHeight:300,maxHeight:3200,
    showCover:false,showPageCorners:false,maxShadowOpacity:.6,drawShadow:true,flippingTime:FLIP_MS,usePortrait:true,mobileScrollSupport:false,autoSize:true,startPage:M-2});
  flip.loadFromHTML(book.querySelectorAll(".page"));
  /* Shiny layer: the turning page gets a soft light streak next to the fold on top of the library's fold shadows. */
  try{
    const R=flip.getRender(), _inner=R.drawInnerShadow.bind(R);
    R.drawInnerShadow=function(){
      _inner();
      try{
        const o=this.shadow.opacity, dir=this.getDirection()===0?"to left":"to right";
        const shine=Math.min(.7,.22+o*1.1);
        this.innerShadow.style.background=
          `linear-gradient(${dir},rgba(0,0,0,${o}) 4%,rgba(255,255,255,${shine}) 13%,rgba(255,255,255,${shine*.35}) 22%,rgba(255,255,255,0) 30%,rgba(0,0,0,${o*.6}) 44%,rgba(0,0,0,0) 100%)`;
      }catch(_){}
    };
  }catch(e){ console.warn("shine layer unavailable",e); }
  layout(); flip.update();   /* the library resets the book width to 100% on start; re-apply our size so the spread is really two pages */
  /* The library forces the first/last page to "hard" (setDensity + the drawing density).
     Undo BOTH, then lock them so every page turn uses the same soft curl. */
  try{
    flip.getPageCollection().getPages().forEach(pg=>{
      if(typeof pg.setDensity==="function") pg.setDensity("soft");
      if(typeof pg.setDrawingDensity==="function") pg.setDrawingDensity("soft");
      pg.density = "soft"; pg.nowDrawingDensity = "soft";
      pg.getDensity = () => "soft";
      pg.setDensity = () => {};
      pg.setDrawingDensity = () => {};
    });
  }catch(e){ console.warn("Could not force soft cover", e); }
  flip.on("flip",()=>{ if(isPortrait()){ const i=flip.getCurrentPageIndex(); if(i<1){flip.turnToPage(1);} else if(i>N){flip.turnToPage(N);} } updateCounter();setView(flip.getCurrentPageIndex());if(window.enhanceVisible)window.enhanceVisible();});
  /* Sound: click / arrows / keys -> "flipping". Cursor DRAG -> "user_fold" (no "flipping" state),
     so play on release; if the page springs back instead of turning, cut the sound. */
  let dragging=false, released=false, dragStart=0;
  // High-resolution rendering is interruptible so page-turn animation always wins.
  let activeHighResTask=null;
  flip.on("changeState",e=>{
    if(e.data!=="read" && activeHighResTask){
      try{ activeHighResTask.cancel(); }catch(_){}
    }
    if(e.data==="read" && pendingDir){ const d=pendingDir; pendingDir=0; setTimeout(()=>go(d),0); }
    if(e.data==="user_fold"){ dragging=true; released=false; dragStart=flip.getCurrentPageIndex(); }
    else if(e.data==="flipping"){ if(!dragging) swish(); }
    else if(e.data==="read" && dragging){
      dragging=false;
      setTimeout(()=>{ if(released && flip.getCurrentPageIndex()===dragStart && lastSnd>=0){ try{sounds[lastSnd].pause();}catch(_){} } },40);
    }
  });
  const onRelease=()=>{ if(dragging && !released){ released=true; swish(); } };
  addEventListener("pointerup",onRelease); addEventListener("mouseup",onRelease); addEventListener("touchend",onRelease);
  /* ================= Page-turn interaction =================
     The library always lifts a page from its top/bottom CORNER. Here the turn starts wherever you
     grab / click the page, and the arrow buttons lift the page from the middle of its edge.
     It drives the library's own flip engine (same curl, same shadows, same sounds).
     If the engine is not reachable, everything falls back to the normal corner turn. */
  const FC = flip.getFlipController && flip.getFlipController();
  const customOK = !!(FC && ["start","animateFlippingTo","setState","do"].every(k=>typeof FC[k]==="function"));
  const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
  /* A plain click on a page must never turn it: the library's click handler is gated, only our own calls pass. */
  let allowLibFlip=false;
  if(FC && typeof FC.flip==="function"){ const _f=FC.flip.bind(FC); FC.flip=pos=>{ if(allowLibFlip) _f(pos); }; }
  window.libTurn=dir=>{ allowLibFlip=true; try{ dir>0?flip.flipNext():flip.flipPrev(); }finally{ allowLibFlip=false; } };
  /* Same speed for every turn: a full turn always takes FLIP_MS, a partial one takes the matching share (never under 45%).
     The library would otherwise shorten the time with the distance left, which made turns feel cut. */
  const turnMs=size=>{ const pw=flip.getBoundsRect().pageWidth||1; return FLIP_MS*Math.min(1,Math.max(.45,size/(2*pw))); };
  window.turnMs=turnMs;
  if(FC) FC.getAnimationDuration=turnMs;
  const geo=()=>{ const r=flip.getBoundsRect(), bk=$("book").getBoundingClientRect(); return {r, pw:r.pageWidth, h:r.height, ox:bk.left+r.left, oy:bk.top+r.top}; };
  const spineX=()=>{ const G=geo(); return G.ox + G.pw*(isPortrait()?0.5:1); };

  function beginFlip(dir,bottom){
    const {r,pw,h}=geo();
    const gx=r.left+(dir>0?pw*1.5:pw*.5), gy=r.top+(bottom?h-1:1);   /* only used to pick direction + corner side */
    if(!FC.start({x:gx,y:gy})) return null;
    return {pw,h,cy:bottom?h:0};
  }
  /* py = grabbed height on the page (null = middle of the edge, flat fold) */
  window.turnAt=(dir,py)=>{
    if(!customOK||isPortrait()) return false;
    try{
      const h=geo().h, bottom = py==null ? true : py>=h/2;
      const f=beginFlip(dir,bottom); if(!f) return false;
      FC.setState("flipping");
      const ys = py==null ? f.cy : f.cy+(clamp(py,0,f.h)-f.cy)*0.35;   /* arrows: level fold from the middle of the edge */
      /* A perfectly level fold (y == corner y) makes the library's geometry degenerate, so nothing was drawn.
         Keep the fold almost vertical (about 3 degrees) so the page lifts evenly from the middle of its edge. */
      const T=0.004, sgn=f.cy>0?-1:1;
      const S={x:f.pw-8,y:py==null ? f.cy+sgn*(0.5+8*T) : ys}, D={x:-f.pw,y:py==null ? f.cy+sgn*(0.5+2*f.pw*T) : f.cy};
      FC.calc.calc(S);
      FC.animateFlippingTo(S,D,true);
      return true;
    }catch(err){ console.warn("custom flip failed, using default",err); return false; }
  };

  let g=null; const SWIPE=6;
  $("book").addEventListener("pointerdown",e=>{
    g=null;
    if(e.button>0 || anim || (flip.getState && flip.getState()!=="read")) return;
    const G=geo(), idx=flip.getCurrentPageIndex();
    const dir=e.clientX>spineX()?1:-1, t=targetSpread(dir);
    if(t===idx) return;
    g={own:customOK&&!isPortrait(), dir, t, idx, x0:e.clientX, y0:e.clientY, py:e.clientY-G.oy, px:e.clientX-G.ox,
       from:{...cur}, to:viewVals(t), started:false, p:0, xv:G.pw, k:1, f:null};
  },true);
  /* when we drive the turn ourselves, the library must not also react to the mouse / touch */
  ["mousedown","touchstart"].forEach(n=>$("book").addEventListener(n,e=>{
    if(!customOK||isPortrait()) return;                 /* portrait: the library handles it */
    if(e.cancelable) e.preventDefault();                /* the library did this itself; without it the browser starts an image drag and cancels the turn */
    e.stopImmediatePropagation();
  },true));
  $("book").addEventListener("dragstart",e=>e.preventDefault());

  let mvRaf=0, mvEv=null;
  addEventListener("pointermove",e=>{
    if(!g||!g.own) return;
    if(g.started && e.pointerType==="mouse" && e.buttons===0){ onUp(e); return; }   /* button released outside the window */
    mvEv=e; if(!mvRaf) mvRaf=requestAnimationFrame(()=>{ mvRaf=0; const ev=mvEv; mvEv=null; if(ev&&g) processMove(ev); });
  });
  function processMove(e){
    if(!g||!g.own) return;
    const G=geo(), dxT=(g.x0-e.clientX)*g.dir;          /* > 0 = dragging toward the other side */
    if(!g.started){
      if(dxT<SWIPE) return;
      try{
        const f=beginFlip(g.dir,g.py>=G.h/2);
        if(!f){ g=null; return; }
        g.f=f; g.started=true; FC.setState("user_fold");
        g.k=1;
      }catch(err){ g=null; return; }
    }
    /* Free-angle fold, like a real page: the fold line is the perpendicular bisector between the point you grabbed
       (moved to the page's outer edge at the same height) and where the cursor is now. So the angle follows
       the grab height and the cursor path, whatever they are. */
    const sx=spineX(), loc=(cx)=>g.dir>0 ? cx-sx : sx-cx;          /* distance from the spine, positive on the grabbed page */
    const gl=clamp(loc(g.x0),G.pw*.25,G.pw), cl=loc(e.clientX);
    const kx=clamp(G.pw/gl,1,4);                                     /* so cursor at the mirrored point = page fully turned */
    const gy=clamp(g.y0-G.oy,0,G.h), cyl=clamp(e.clientY-G.oy,-G.h*.25,G.h*1.25);
    const A={x:G.pw,y:gy}, P={x:Math.min(G.pw-.5,G.pw-(gl-cl)*kx), y:cyl};
    const dx=P.x-A.x, dy=P.y-A.y, len=Math.hypot(dx,dy)||1, nx=dx/len, ny=dy/len;
    const Mx=(A.x+P.x)/2, My=(A.y+P.y)/2, Kx=G.pw, Ky=g.f.cy;       /* K = the corner being lifted */
    const sd=(Kx-Mx)*nx+(Ky-My)*ny;
    let px=Kx-2*sd*nx, py=Ky-2*sd*ny;                                /* corner mirrored across the fold line */
    px=clamp(px,-G.pw,G.pw);
    const bottom=Ky>0, minOff=0.5+Math.max(0,G.pw-px)*0.004;        /* never exactly level: the engine draws nothing then */
    /* only step away from the exactly-level case; keep whichever side of the corner height the fold is really on */
    if(Math.abs(py-Ky)<minOff) py = Ky + (bottom?-minOff:minOff);
    g.xv=px;
    try{ FC.do({x:px,y:py}); }catch(err){}
    g.p=(G.pw-g.xv)/(2*G.pw);
    applyVals(mix(g.from,g.to,g.p));                       /* book shift follows the same progress */
  }

  function releaseOwn(d,turns){
    const pos=FC.calc.getPosition(), dest={x:turns?-d.f.pw:d.f.pw,y:d.f.cy};
    FC.animateFlippingTo(pos,dest,turns);
    const ms=turnMs(Math.abs(pos.x-dest.x));   /* same duration the page animation uses */
    if(turns) tweenTo(d.to,ms,linear,d.t); else tweenTo(d.from,ms,linear,d.idx);
  }
  function onUp(e){
    if(mvRaf){ cancelAnimationFrame(mvRaf); mvRaf=0; }
    if(mvEv&&g){ const ev=mvEv; mvEv=null; processMove(ev); } mvEv=null;
    const d=g; g=null; if(!d) return;
    if(d.own){
      if(!d.started) return;      /* a plain click does nothing */
      const crossed=(e.clientX>spineX()?1:-1)!==d.dir;
      try{ releaseOwn(d,crossed||d.xv<=0); }catch(err){ console.warn(err); }
      return;
    }
    /* default (library-driven) turns: still keep the shift in step */
    const moved=Math.abs(e.clientX-d.x0)>SWIPE, crossed=(e.clientX>spineX()?1:-1)!==d.dir;
    if(moved&&crossed) setView(d.t,FLIP_MS,linear,true);
  }
  addEventListener("pointerup",onUp);
  addEventListener("pointercancel",()=>{ const d=g; g=null; if(d&&d.own&&d.started){ try{releaseOwn(d,false);}catch(err){} } });
  flip.on("changeState",()=>updateGutter());
  let stuckAt=0;
  setInterval(()=>{
    if(!flip) return;
    const st=flip.getState();
    if(st==="read"||ptrDown||anim){ stuckAt=0; return; }
    if(!stuckAt){ stuckAt=performance.now(); return; }
    if(performance.now()-stuckAt>FLIP_MS*2.5){
      stuckAt=0; g=null;
      try{ FC.setState("read"); }catch(_){}
      try{ flip.turnToPage(flip.getCurrentPageIndex()); }catch(_){}
      updateCounter(); setView(flip.getCurrentPageIndex(),0,linear,true);
    }
  },500);
  flip.on("changeOrientation",()=>{updateCounter();setView(flip.getCurrentPageIndex(),0,linear,true);});
  updateCounter(); setView(M-2);

  /* Pages the reader is looking at (real page numbers). */
  function visiblePdfPages(){
    if(!flip) return [];
    const index=flip.getCurrentPageIndex();
    const pages=isPortrait() ? [pageAt(index)] : [pageAt(index), pageAt(index+1)];
    return [...new Set(pages.filter(p=>Number.isInteger(p) && p>=1 && p<=total))];
  }
  const hasBase=new Set();
  const fetchImg=url=>new Promise((res,rej)=>{ const t=new Image(); t.decoding="async"; t.onload=()=>res(t); t.onerror=()=>rej(new Error("load "+url)); t.src=url; });

  /* ---- Normal pages: plain image files, several downloading in parallel ---- */
  async function loadBase(i,decode){
    const url=BASE(i);
    for(let a=0;a<3;a++){
      try{
        const t=await fetchImg(a ? url+"?retry="+a : url);
        const im=imgs[i]; im.decoding="async"; im.src=t.src; im.dataset.baseUrl=t.src; hasBase.add(i);
        if(decode){ try{ await im.decode(); }catch(_){} }   /* only the first few are pre-decoded; the rest decode when first shown */
        return true;
      }catch(err){ await new Promise(r=>setTimeout(r,400*(a+1))); }
    }
    console.warn("Could not load page "+i); return false;
  }

  /* ---- Sharp pages: the big -hi image is fetched only for the pages you look at while zoomed in ---- */
  const enhanced=[]; let enhancing=false;
  const wantSharp=()=>zoomOn && zoomV>1.15;
  function dropSharp(j){
    const ij=imgs[j]; if(!ij || ij.dataset.hi!=="1") return;
    ij.src=ij.dataset.baseUrl; ij.dataset.hi="0";
  }
  window.releaseEnhanced=()=>{ while(enhanced.length) dropSharp(enhanced.shift()); };
  async function enhanceVisible(){
    if(enhancing || !wantSharp()) return;
    enhancing=true;
    try{
      for(const i of visiblePdfPages()){
        const im=imgs[i];
        if(!im || !hasBase.has(i) || im.dataset.hi==="1" || im.dataset.hi==="x") continue;
        if(!wantSharp()) break;
        try{
          const t=await fetchImg(HI(i));
          try{ await t.decode(); }catch(_){}
          if(!wantSharp()) break;
          im.src=t.src; im.dataset.hi="1"; enhanced.push(i);
          while(enhanced.length>MAX_HI_KEPT) dropSharp(enhanced.shift());
        }catch(err){ im.dataset.hi="x"; console.warn("Could not load sharp page "+i,err); }
      }
    }finally{
      enhancing=false;
      /* the visible spread may have changed while we were busy */
      if(wantSharp() && visiblePdfPages().some(p=>hasBase.has(p) && imgs[p] && imgs[p].dataset.hi!=="1" && imgs[p].dataset.hi!=="x")) setTimeout(enhanceVisible,200);
    }
  }
  window.enhanceVisible=enhanceVisible;

  /* ---- Open as soon as the cover is in, then load the rest 6 at a time ---- */
  let done=0;
  const tick=()=>{ done++; const pct=(done/total*100)+"%"; $("bar").firstElementChild.style.width=pct; $("prog").firstElementChild.style.width=pct; };
  if(!(await loadBase(1,true))) throw new Error("cover missing");
  tick();
  $("loading").style.display="none";
  updateCounter();
  let nextPage=2;
  const worker=async()=>{
    while(nextPage<=total){ const i=nextPage++; await loadBase(i,i<=4); tick(); }
  };
  await Promise.all(Array.from({length:6},worker));
  $("prog").style.opacity="0";
  updateCounter();
  initSounds();            /* page-turn sounds download only now that the pages are done */
}
main().catch(e=>{$("loading").innerHTML="<span>Could not load the pages. Make sure the pages/ folder is next to index.html.</span>";console.error(e);});

/* Navigation */
$("next").onclick=()=>go(1);
$("prev").onclick=()=>go(-1);
$("first").onclick=()=>{ const t=isPortrait()?1:0;   flip.turnToPage(t);updateCounter();setView(t,900,easeIO,true); };  /* left  = end of the book */
$("last").onclick =()=>{ const t=isPortrait()?N:M-2; flip.turnToPage(t);updateCounter();setView(t,900,easeIO,true); };  /* right = cover */
addEventListener("keydown",e=>{
  if(!flip) return;
  if(e.key==="Escape") closeDl();
  if(e.key==="ArrowRight") go(1);   /* back */
  if(e.key==="ArrowLeft") go(-1);   /* forward (RTL book) */
});
addEventListener("resize",()=>{ if(flip){layout(); flip.update(); updateCounter(); setView(flip.getCurrentPageIndex(),0,linear,true);} });

/* Share */
$("bShare").onclick=async()=>{
  const data={title:TITLE,url:location.href};
  if(navigator.share){ try{await navigator.share(data);return;}catch(e){} }
  try{await navigator.clipboard.writeText(location.href);toast("Link copied");}catch(e){toast(location.href);}
};

/* Download popup: full PDF, current right page, current left page */
let pdfBytes=null, pdfLibDoc=null;
function saveBlob(blob,name){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000);}
function currentPages(){
  const i=flip.getCurrentPageIndex();
  if(isPortrait()) return {single:pdfIdx(i)};
  return {left:pdfIdx(i), right:pdfIdx(i+1)};
}
function openDl(){
  const cp=currentPages();
  const r=$("dlRight"), l=$("dlLeft");
  if(cp.single!==undefined){ r.hidden=false; l.hidden=true; $("dlRightT").textContent="Current Page"; r.dataset.p=cp.single; }
  else{
    $("dlRightT").textContent="Current Right Page"; $("dlLeftT").textContent="Current Left Page";
    r.hidden = cp.right===undefined; l.hidden = cp.left===undefined;
    r.dataset.p = cp.right; l.dataset.p = cp.left;
  }
  $("dlModal").classList.add("on");
  if(window.PDF_BYTES) $("dlFullTitle").textContent="AW27 DALYDRESS LOOKBOOK - "+(window.PDF_BYTES/1048576).toFixed(1)+" MB";
}
function closeDl(){ $("dlModal").classList.remove("on"); }
let pdfLibPromise=null;
function loadPdfLib(){
  if(window.PDFLib) return Promise.resolve();
  return pdfLibPromise||(pdfLibPromise=new Promise((res,rej)=>{
    const s=document.createElement("script");
    s.src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js";
    s.onload=res; s.onerror=()=>{pdfLibPromise=null;rej(new Error("pdf-lib failed to load"));};
    document.head.appendChild(s);
  }));
}
async function downloadPage(n){
  closeDl();
  try{
    toast(pdfLibDoc ? "Preparing page…" : "Downloading the PDF to extract this page…");
    await loadPdfLib();
    if(!pdfLibDoc){
      if(!pdfBytes) pdfBytes = await (await fetch(PDF_URL)).arrayBuffer();
      pdfLibDoc = await PDFLib.PDFDocument.load(pdfBytes);
    }
    const out = await PDFLib.PDFDocument.create();
    const [pg] = await out.copyPages(pdfLibDoc,[n]);
    out.addPage(pg);
    const bytes = await out.save();
    saveBlob(new Blob([bytes],{type:"application/pdf"}), TITLE+" - page "+(n+1)+".pdf");
  }catch(e){ toast("Could not export this page"); console.error(e); }
}
$("bDown").onclick=openDl;
$("dlClose").onclick=closeDl;
$("dlModal").onclick=e=>{ if(e.target===$("dlModal")) closeDl(); };
$("dlFull").onclick=async()=>{ closeDl(); toast("Downloading PDF…");
  const fname=TITLE+".pdf";
  try{ const r=await fetch(PDF_URL); if(!r.ok) throw 0; saveBlob(await r.blob(), fname); }
  catch(e){ const a=document.createElement("a");a.href=PDF_URL;a.download=fname;document.body.appendChild(a);a.click();a.remove(); }
};
$("dlRight").onclick=()=>downloadPage(+$("dlRight").dataset.p);
$("dlLeft").onclick=()=>downloadPage(+$("dlLeft").dataset.p);

/* Sound + volume (number only, no % sign) */
function setVol(v){
  vol=v/100; sounds.forEach(a=>a.volume=vol); $("volVal").textContent=v;
  $("bSound").classList.toggle("off",!soundOn||vol===0);
}
$("vol").oninput=e=>{ const v=+e.target.value; if(v>0) soundOn=true; setVol(v); };
$("bSound").onclick=()=>{
  soundOn=!soundOn;
  if(soundOn && vol===0){ $("vol").value=70; setVol(70); }
  $("bSound").classList.toggle("off",!soundOn||vol===0);
  toast(soundOn?"Sound on":"Sound off");
};

/* Fullscreen + auto-play */
$("bFull").onclick=()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();};
$("bPlay").onclick=()=>{
  if(timer){clearInterval(timer);timer=null;$("bPlay").classList.remove("off");toast("Auto-play stopped");return;}
  toast("Auto-play started");
  timer=setInterval(()=>{ if(flip.getCurrentPageIndex()<=(isPortrait()?1:0)){clearInterval(timer);timer=null;return;} go(-1); },AUTOPLAY_MS);
};

/* Zoom button + zoom bar, drag to pan */
let zoomOn=false, zoomV=1, tx=0, ty=0;
const ICON_IN ='<circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5M10.5 7.5v6M7.5 10.5h6"/>';
const ICON_OUT='<circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5M7.5 10.5h6"/>';
function applyZoom(){
  const z=zoomOn?zoomV:1; if(z<=1){tx=ty=0;}
  $("stage").style.transform=`translate(${tx}px,${ty}px) scale(${z})`;
  $("pan").classList.toggle("on",z>1);
  $("zoomBar").classList.toggle("on",zoomOn);
  $("bZoom").classList.toggle("on",zoomOn);
  $("bZoom").firstElementChild.innerHTML=zoomOn?ICON_OUT:ICON_IN;
  $("zRange").value=zoomV;
  if(z>1.15){ clearTimeout(applyZoom.e); applyZoom.e=setTimeout(()=>{ if(window.enhanceVisible) window.enhanceVisible(); },250); }
  else if(window.releaseEnhanced) window.releaseEnhanced();
}
function setZoom(v){ zoomV=Math.min(ZOOM_MAX,Math.max(1,v)); applyZoom(); }
$("bZoom").onclick=()=>{ zoomOn=!zoomOn; if(zoomOn){ zoomV=ZOOM_DEFAULT; toast("Drag to move, arrow keys to turn"); } applyZoom(); };
$("zIn").onclick=()=>setZoom(zoomV+ZOOM_STEP);
$("zOut").onclick=()=>setZoom(zoomV-ZOOM_STEP);
$("zRange").oninput=e=>{ $("stage").classList.add("drag"); clearTimeout(applyZoom.t); applyZoom.t=setTimeout(()=>$("stage").classList.remove("drag"),150); setZoom(+e.target.value); };
(()=>{
  const pan=$("pan"); let down=false,sx,sy,ox,oy;
  pan.onpointerdown=e=>{down=true;sx=e.clientX;sy=e.clientY;ox=tx;oy=ty;pan.setPointerCapture(e.pointerId);pan.style.cursor="grabbing";$("stage").classList.add("drag");};
  pan.onpointermove=e=>{if(!down)return;tx=ox+e.clientX-sx;ty=oy+e.clientY-sy;applyZoom();};
  pan.onpointerup=()=>{down=false;pan.style.cursor="grab";$("stage").classList.remove("drag");};
})();
</script>
